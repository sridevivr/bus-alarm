<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bus Alarm</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    /* ── Reset & tokens ─────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --tc:        #c1614f;
      --tc-dark:   #a84e3d;
      --tc-light:  #f2e0db;
      --tc-faint:  #fdf6f4;
      --text:      #2d2522;
      --muted:     #7a6460;
      --border:    #e0cdc9;
      --white:     #ffffff;
      --r:         12px;
      --safe:      #3db885;
      --amber:     #e8963a;
      --danger:    #e05252;
    }

    body {
      font-family: 'Nunito', sans-serif;
      background: var(--tc-faint);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Screen switcher ─────────────────────────────── */
    .screen {
      display: none;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 48px;
      min-height: 100vh;
    }
    .screen.active { display: flex; }

    /* ── Shared card ─────────────────────────────────── */
    .card {
      background: var(--white);
      border-radius: 20px;
      padding: 28px 24px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 4px 24px rgba(193,97,79,.10);
    }

    /* ═══════════════════════════════════════════════
       SETUP SCREEN
    ═══════════════════════════════════════════════ */
    #screen-setup header { text-align: center; margin-bottom: 32px; }
    .bus-icon { font-size: 48px; line-height: 1; margin-bottom: 8px; }
    #screen-setup h1 { font-size: 1.8rem; font-weight: 800; color: var(--tc); letter-spacing: -.3px; }
    #screen-setup header p { font-size: .95rem; color: var(--muted); margin-top: 4px; }

    .field { margin-bottom: 24px; }

    label {
      display: block; font-size: .85rem; font-weight: 700;
      color: var(--muted); text-transform: uppercase;
      letter-spacing: .6px; margin-bottom: 8px;
    }

    input[type="text"] {
      width: 100%; padding: 12px 16px;
      font-family: 'Nunito', sans-serif; font-size: 1rem; font-weight: 600;
      color: var(--text); background: var(--tc-faint);
      border: 2px solid var(--border); border-radius: var(--r);
      outline: none; transition: border-color .2s, box-shadow .2s;
    }
    input[type="text"]:focus { border-color: var(--tc); box-shadow: 0 0 0 3px rgba(193,97,79,.15); }
    input[type="text"]::placeholder { color: #c4adaa; font-weight: 400; }

    .stop-row { display: flex; gap: 10px; align-items: center; }
    .stop-row input[type="text"] { flex: 1; }

    .btn-find {
      flex-shrink: 0; padding: 12px 18px;
      font-family: 'Nunito', sans-serif; font-size: .9rem; font-weight: 700;
      color: var(--tc); background: var(--tc-light);
      border: 2px solid var(--tc-light); border-radius: var(--r);
      cursor: pointer; transition: background .2s, border-color .2s; white-space: nowrap;
    }
    .btn-find:hover { background: #e8c8c2; border-color: #e8c8c2; }
    .btn-find:active { background: #d9b0a9; }
    .btn-find:disabled { opacity: .6; cursor: wait; }

    .slider-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
    .slider-value { font-size: 1.4rem; font-weight: 800; color: var(--tc); }
    .slider-value span { font-size: .85rem; font-weight: 600; color: var(--muted); }

    input[type="range"] {
      -webkit-appearance: none; appearance: none;
      width: 100%; height: 6px;
      background: var(--tc-light); border-radius: 99px; outline: none; cursor: pointer;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none;
      width: 24px; height: 24px; background: var(--tc);
      border-radius: 50%; border: 3px solid var(--white);
      box-shadow: 0 2px 6px rgba(193,97,79,.4); transition: transform .15s;
    }
    input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.15); }
    input[type="range"]::-moz-range-thumb {
      width: 24px; height: 24px; background: var(--tc);
      border-radius: 50%; border: 3px solid var(--white);
      box-shadow: 0 2px 6px rgba(193,97,79,.4); cursor: pointer;
    }
    .slider-ticks {
      display: flex; justify-content: space-between;
      margin-top: 6px; padding: 0 2px;
      font-size: .75rem; color: #c4adaa; font-weight: 600;
    }

    .divider { height: 1px; background: var(--border); margin: 28px 0; }

    .btn-start {
      width: 100%; padding: 16px;
      font-family: 'Nunito', sans-serif; font-size: 1.1rem; font-weight: 800;
      color: var(--white); background: var(--tc);
      border: none; border-radius: var(--r); cursor: pointer; letter-spacing: .2px;
      transition: background .2s, transform .15s, box-shadow .2s;
      box-shadow: 0 4px 14px rgba(193,97,79,.35);
    }
    .btn-start:hover { background: var(--tc-dark); box-shadow: 0 6px 18px rgba(193,97,79,.45); }
    .btn-start:active { transform: scale(.98); }
    .btn-start:disabled { background: #d4b5af; box-shadow: none; cursor: not-allowed; }

    .stop-results {
      margin-top: 10px; border: 2px solid var(--border);
      border-radius: var(--r); overflow: hidden;
      max-height: 220px; overflow-y: auto;
    }
    .stop-results:empty { display: none; }
    .stop-item {
      display: flex; flex-direction: column; padding: 12px 14px;
      cursor: pointer; border-bottom: 1px solid var(--border);
      transition: background .15s; user-select: none;
    }
    .stop-item:last-child { border-bottom: none; }
    .stop-item:hover { background: var(--tc-faint); }
    .stop-item.selected { background: var(--tc-light); }
    .stop-item-name { font-size: .95rem; font-weight: 700; color: var(--text); }
    .stop-item-id { font-size: .78rem; font-weight: 600; color: var(--muted); margin-top: 2px; }

    .stop-message { margin-top: 10px; padding: 12px 14px; border-radius: var(--r); font-size: .9rem; font-weight: 600; }
    .stop-message.error { background: #fdf0ee; color: var(--tc-dark); border: 2px solid #f2d0ca; }
    .stop-message.loading { background: var(--tc-faint); color: var(--muted); border: 2px solid var(--border); }

    .stop-results::-webkit-scrollbar { width: 6px; }
    .stop-results::-webkit-scrollbar-track { background: var(--tc-faint); }
    .stop-results::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }

    .stop-id-toggle {
      display: block; margin-top: 12px; text-align: center;
      font-size: .82rem; font-weight: 700; color: var(--muted);
      background: none; border: none; cursor: pointer; padding: 2px 0;
      text-decoration: underline; text-underline-offset: 3px;
      transition: color .15s;
    }
    .stop-id-toggle:hover { color: var(--tc); }

    .stop-id-panel {
      margin-top: 12px; padding: 14px;
      background: var(--tc-faint); border: 2px solid var(--border);
      border-radius: var(--r);
    }
    .stop-id-panel.hidden { display: none; }

    .stop-id-row { display: flex; gap: 8px; align-items: center; }
    .stop-id-row input[type="text"] { flex: 1; }

    .btn-use-stop {
      flex-shrink: 0; padding: 12px 14px;
      font-family: 'Nunito', sans-serif; font-size: .85rem; font-weight: 700;
      color: var(--white); background: var(--tc);
      border: none; border-radius: var(--r);
      cursor: pointer; white-space: nowrap;
      transition: background .2s;
    }
    .btn-use-stop:hover { background: var(--tc-dark); }
    .btn-use-stop:active { opacity: .85; }

    footer { margin-top: 24px; font-size: .8rem; color: #c4adaa; text-align: center; }

    /* ═══════════════════════════════════════════════
       MONITOR SCREEN
    ═══════════════════════════════════════════════ */
    .monitor-topbar {
      display: flex; justify-content: space-between; align-items: flex-start;
      width: 100%; max-width: 440px; margin-bottom: 28px;
    }
    .monitor-route-badge {
      display: inline-block; background: var(--tc); color: var(--white);
      font-size: .85rem; font-weight: 800;
      padding: 3px 12px; border-radius: 99px; letter-spacing: .3px; margin-bottom: 5px;
    }
    .monitor-stop-name { font-size: 1.1rem; font-weight: 700; color: var(--text); line-height: 1.25; }

    .btn-settings {
      background: none; border: none; cursor: pointer;
      font-size: 1.3rem; color: var(--muted);
      padding: 6px; border-radius: 8px; line-height: 1; flex-shrink: 0;
      transition: color .2s, background .2s;
    }
    .btn-settings:hover { color: var(--text); background: var(--tc-light); }

    /* ── Countdown ring ──────────────────────────── */
    .countdown-wrapper {
      position: relative; width: 220px; height: 220px;
      margin: 0 auto 32px;
      --ring-color: var(--safe);
    }
    .countdown-wrapper.amber  { --ring-color: var(--amber); }
    .countdown-wrapper.danger { --ring-color: var(--danger); }
    .countdown-wrapper.unknown { --ring-color: #c4adaa; }

    .ring-svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .ring-bg { fill: none; stroke: #f0e6e3; stroke-width: 14; }
    .ring-fill {
      fill: none; stroke: var(--ring-color); stroke-width: 14; stroke-linecap: round;
      transition: stroke-dashoffset .9s cubic-bezier(.4,0,.2,1), stroke .4s ease;
    }

    .countdown-center {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .countdown-number {
      font-size: 4.5rem; font-weight: 800; line-height: 1;
      color: var(--ring-color); transition: color .4s ease;
    }
    .countdown-unit { font-size: .95rem; font-weight: 700; color: var(--muted); margin-top: 4px; text-transform: uppercase; letter-spacing: .5px; }

    /* ── Other buses ─────────────────────────────── */
    .other-section { width: 100%; max-width: 440px; margin-bottom: 20px; }
    .other-section-title { font-size: .78rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; margin-bottom: 10px; }
    .other-buses-card { background: var(--white); border-radius: 16px; overflow: hidden; box-shadow: 0 2px 12px rgba(193,97,79,.08); }
    .bus-row { display: flex; align-items: center; padding: 12px 16px; gap: 12px; border-bottom: 1px solid var(--border); }
    .bus-row:last-child { border-bottom: none; }
    .bus-route-pill { flex-shrink: 0; background: var(--tc-light); color: var(--tc-dark); font-size: .8rem; font-weight: 800; padding: 3px 10px; border-radius: 99px; min-width: 52px; text-align: center; }
    .bus-direction { flex: 1; font-size: .9rem; font-weight: 600; color: var(--text); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .bus-mins { flex-shrink: 0; font-size: 1rem; font-weight: 800; color: var(--muted); }
    .bus-mins em { font-style: normal; font-size: .75rem; font-weight: 600; }
    .other-empty { padding: 18px; text-align: center; font-size: .9rem; color: var(--muted); font-weight: 600; }

    .status-line { font-size: .8rem; font-weight: 600; color: #c4adaa; text-align: center; width: 100%; max-width: 440px; }

    /* ═══════════════════════════════════════════════
       ALARM OVERLAY
    ═══════════════════════════════════════════════ */
    .alarm-overlay {
      position: fixed; inset: 0; z-index: 200;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 32px 24px;
      background: var(--danger);
      animation: alarm-bg-pulse 1.1s ease-in-out infinite alternate;
    }
    .alarm-overlay.hidden { display: none; }

    @keyframes alarm-bg-pulse {
      from { background: #e05252; }
      to   { background: #b53030; }
    }

    .alarm-bus-icon {
      font-size: 72px; line-height: 1; margin-bottom: 20px;
      animation: bus-bounce .55s ease-in-out infinite alternate;
    }
    @keyframes bus-bounce {
      from { transform: translateY(0) rotate(-3deg); }
      to   { transform: translateY(-10px) rotate(3deg); }
    }

    .alarm-heading {
      font-size: 3rem; font-weight: 800; color: var(--white);
      letter-spacing: -.5px; margin-bottom: 20px; text-align: center;
    }

    .alarm-badge-row {
      display: flex; align-items: center; gap: 10px; margin-bottom: 6px;
    }

    .alarm-route-badge {
      background: rgba(255,255,255,.25); color: var(--white);
      font-size: 1rem; font-weight: 800;
      padding: 4px 16px; border-radius: 99px; letter-spacing: .3px;
    }

    .alarm-mins {
      font-size: 1.6rem; font-weight: 800; color: var(--white);
    }

    .alarm-subtext {
      font-size: 1rem; color: rgba(255,255,255,.8);
      font-weight: 600; margin-top: 6px; margin-bottom: 40px; text-align: center;
    }

    .btn-dismiss {
      padding: 18px 36px;
      font-family: 'Nunito', sans-serif; font-size: 1.05rem; font-weight: 800;
      color: var(--danger); background: var(--white);
      border: none; border-radius: 16px; cursor: pointer;
      box-shadow: 0 6px 24px rgba(0,0,0,.25);
      transition: transform .15s, box-shadow .15s;
    }
    .btn-dismiss:hover { transform: scale(1.04); box-shadow: 0 8px 28px rgba(0,0,0,.3); }
    .btn-dismiss:active { transform: scale(.97); }
  </style>
</head>
<body>

  <!-- ════════════ SETUP SCREEN ════════════ -->
  <div id="screen-setup" class="screen active">

    <header>
      <div class="bus-icon">🚌</div>
      <h1>Bus Alarm</h1>
      <p>Never miss your stop again</p>
    </header>

    <div class="card">

      <div class="field">
        <label for="bus-route">Bus Route</label>
        <input type="text" id="bus-route" placeholder="e.g. D50" autocomplete="off" />
      </div>

      <div class="field">
        <label for="stop-name">Stop Name</label>
        <div class="stop-row">
          <input type="text" id="stop-name" placeholder="e.g. Central Station" autocomplete="off" />
          <button class="btn-find" id="btn-find">Find</button>
        </div>
        <div id="stop-feedback"></div>
        <div class="stop-results" id="stop-results"></div>
        <button class="stop-id-toggle" id="stop-id-toggle">I know my stop ID</button>
        <div class="stop-id-panel hidden" id="stop-id-panel">
          <div class="stop-id-row">
            <input type="text" id="manual-stop-id" placeholder="e.g. 1001631" autocomplete="off" inputmode="numeric" />
            <button class="btn-use-stop" id="btn-use-stop">Use this stop</button>
          </div>
        </div>
      </div>

      <div class="field">
        <div class="slider-header">
          <label for="alert-minutes" style="margin-bottom:0">Alert me</label>
          <div class="slider-value"><span id="minutes-display">10</span> <span>min before</span></div>
        </div>
        <input type="range" id="alert-minutes" min="2" max="20" value="10" />
        <div class="slider-ticks">
          <span>2</span><span>5</span><span>10</span><span>15</span><span>20</span>
        </div>
      </div>

      <div class="divider"></div>

      <button class="btn-start" id="btn-start" disabled>Start Watching 🔔</button>

    </div>

    <footer>Stay on track, wherever you ride.</footer>

  </div>

  <!-- ════════════ MONITOR SCREEN ════════════ -->
  <div id="screen-monitor" class="screen">

    <div class="monitor-topbar">
      <div>
        <div class="monitor-route-badge" id="monitor-route-badge">--</div>
        <div class="monitor-stop-name" id="monitor-stop-name">--</div>
      </div>
      <button class="btn-settings" id="btn-settings" title="Back to setup">⚙️</button>
    </div>

    <div class="countdown-wrapper unknown" id="countdown-wrapper">
      <svg class="ring-svg" viewBox="0 0 200 200" aria-hidden="true">
        <circle class="ring-bg"   cx="100" cy="100" r="84" />
        <circle class="ring-fill" cx="100" cy="100" r="84" id="ring-fill" />
      </svg>
      <div class="countdown-center">
        <div class="countdown-number" id="countdown-number">--</div>
        <div class="countdown-unit">min</div>
      </div>
    </div>

    <div class="other-section">
      <div class="other-section-title">Also at this stop</div>
      <div class="other-buses-card" id="other-buses-card">
        <div class="other-empty">Loading…</div>
      </div>
    </div>

    <div class="status-line" id="status-line">Fetching predictions…</div>

  </div>

  <!-- ════════════ ALARM OVERLAY ════════════ -->
  <div id="alarm-overlay" class="alarm-overlay hidden">
    <div class="alarm-bus-icon">🚌</div>
    <h2 class="alarm-heading">Time to go!</h2>
    <div class="alarm-badge-row">
      <div class="alarm-route-badge" id="alarm-route-badge">--</div>
      <div class="alarm-mins" id="alarm-mins">-- min away</div>
    </div>
    <p class="alarm-subtext">Your bus is almost here</p>
    <button class="btn-dismiss" id="btn-dismiss">Got it, I'm heading out! 👟</button>
  </div>

  <script>
    /* ── Config ───────────────────────────────────────── */
    const WMATA_API_KEY = '5754b8212b834edfa9f1ab95932dea7f';
    const RING_MAX_MIN  = 20;
    const POLL_SECONDS  = 60;
    const CIRCUMFERENCE = 2 * Math.PI * 84;

    /* ── DOM ──────────────────────────────────────────── */
    const screenSetup       = document.getElementById('screen-setup');
    const screenMonitor     = document.getElementById('screen-monitor');

    const slider            = document.getElementById('alert-minutes');
    const minutesDisplay    = document.getElementById('minutes-display');
    const btnFind           = document.getElementById('btn-find');
    const btnStart          = document.getElementById('btn-start');
    const resultsEl         = document.getElementById('stop-results');
    const feedbackEl        = document.getElementById('stop-feedback');
    const stopInput         = document.getElementById('stop-name');

    const monitorRouteBadge = document.getElementById('monitor-route-badge');
    const monitorStopName   = document.getElementById('monitor-stop-name');
    const btnSettings       = document.getElementById('btn-settings');
    const countdownWrapper  = document.getElementById('countdown-wrapper');
    const ringFill          = document.getElementById('ring-fill');
    const countdownNumber   = document.getElementById('countdown-number');
    const otherBusesCard    = document.getElementById('other-buses-card');
    const statusLine        = document.getElementById('status-line');

    const alarmOverlay      = document.getElementById('alarm-overlay');
    const alarmRouteBadge   = document.getElementById('alarm-route-badge');
    const alarmMins         = document.getElementById('alarm-mins');
    const btnDismiss        = document.getElementById('btn-dismiss');

    /* ── Runtime state ────────────────────────────────── */
    let selectedStop  = null;
    let watchConfig   = null;
    let tickTimer     = null;
    let tickCountdown = POLL_SECONDS;
    let lastUpdatedAt = '';

    // Alarm state
    let alarmFired    = false; // true once fired; cleared when bus departs
    let audioCtx      = null;
    let beepTimer     = null;

    ringFill.style.strokeDasharray  = CIRCUMFERENCE;
    ringFill.style.strokeDashoffset = CIRCUMFERENCE;

    /* ── Boot: restore saved config ──────────────────── */
    (function restoreConfig() {
      try {
        const saved = localStorage.getItem('busAlarmConfig');
        if (!saved) return;
        const cfg = JSON.parse(saved);
        if (!cfg.route || !cfg.stop?.StopID || !cfg.stop?.Name || !cfg.alertMinutes) return;
        watchConfig = cfg;
        enterMonitor();
      } catch (e) {
        localStorage.removeItem('busAlarmConfig');
      }
    })();

    /* ════════════════════════════════════════════════════
       SETUP SCREEN
    ════════════════════════════════════════════════════ */
    slider.addEventListener('input', () => {
      minutesDisplay.textContent = slider.value;
    });

    function setFeedback(msg, type) {
      feedbackEl.innerHTML = msg ? `<div class="stop-message ${type}">${msg}</div>` : '';
    }

    function clearResults() {
      resultsEl.innerHTML = '';
      feedbackEl.innerHTML = '';
      selectedStop = null;
      btnStart.disabled = true;
    }

    function selectStop(item, stop) {
      document.querySelectorAll('.stop-item').forEach(el => el.classList.remove('selected'));
      item.classList.add('selected');
      selectedStop = stop;
      stopInput.value = stop.Name;
      btnStart.disabled = false;
    }

    function renderStops(stops) {
      resultsEl.innerHTML = '';
      stops.forEach(stop => {
        const item = document.createElement('div');
        item.className = 'stop-item';
        item.innerHTML = `
          <span class="stop-item-name">${stop.Name}</span>
          <span class="stop-item-id">Stop ID: ${stop.StopID}</span>
        `;
        item.addEventListener('click', () => selectStop(item, stop));
        resultsEl.appendChild(item);
      });
    }

    btnFind.addEventListener('click', async () => {
      const route = document.getElementById('bus-route').value.trim().toUpperCase();
      const query = stopInput.value.trim().toLowerCase();

      if (!route) {
        clearResults();
        setFeedback('Please enter a bus route first.', 'error');
        return;
      }

      clearResults();
      setFeedback('Looking up stops…', 'loading');
      btnFind.disabled = true;
      btnFind.textContent = '…';

      try {
        const url = `https://api.wmata.com/Bus.svc/json/jRouteDetails?RouteID=${encodeURIComponent(route)}&api_key=${WMATA_API_KEY}`;
        const res = await fetch(url);
        if (!res.ok) throw new Error(`${res.status}`);
        const data = await res.json();

        const seen = new Set();
        const allStops = [];
        for (const dir of [data.Direction0, data.Direction1]) {
          if (!dir || !Array.isArray(dir.Stops)) continue;
          for (const s of dir.Stops) {
            if (!seen.has(s.StopID)) { seen.add(s.StopID); allStops.push(s); }
          }
        }

        if (!allStops.length) {
          setFeedback(`No stops found for route "${route}". Try a different route.`, 'error');
          return;
        }

        const filtered = query
          ? allStops.filter(s => s.Name.toLowerCase().includes(query))
          : allStops;

        setFeedback('', '');
        filtered.length
          ? renderStops(filtered)
          : setFeedback(`No stops matching "${stopInput.value}" on route ${route}.`, 'error');

      } catch (err) {
        console.error('WMATA route API error:', err);
        setFeedback("Couldn't load stops. Check your route and try again.", 'error');
      } finally {
        btnFind.disabled = false;
        btnFind.textContent = 'Find';
      }
    });

    /* ── Manual stop ID fallback ─────────────────────── */
    const stopIdToggle = document.getElementById('stop-id-toggle');
    const stopIdPanel  = document.getElementById('stop-id-panel');
    const manualStopId = document.getElementById('manual-stop-id');
    const btnUseStop   = document.getElementById('btn-use-stop');

    stopIdToggle.addEventListener('click', () => {
      const opening = stopIdPanel.classList.toggle('hidden');
      stopIdToggle.textContent = opening ? 'I know my stop ID' : 'Hide stop ID entry';
      if (!opening) manualStopId.focus();
    });

    async function applyManualStop() {
      const id = manualStopId.value.trim();
      if (!id) { manualStopId.focus(); return; }

      btnUseStop.disabled = true;
      btnUseStop.textContent = '…';

      let name = `Stop ${id}`;
      try {
        const url = `https://api.wmata.com/NextBusService.svc/json/jPredictions?StopID=${encodeURIComponent(id)}&api_key=${WMATA_API_KEY}`;
        const res = await fetch(url);
        if (res.ok) {
          const data = await res.json();
          if (data.StopName) name = data.StopName;
        }
      } catch (_) { /* keep the fallback name */ }

      // Deselect any item chosen via the results list
      document.querySelectorAll('.stop-item').forEach(el => el.classList.remove('selected'));
      selectedStop      = { StopID: id, Name: name };
      stopInput.value   = name;
      btnStart.disabled = false;
      stopIdPanel.classList.add('hidden');
      stopIdToggle.textContent = 'I know my stop ID';

      btnUseStop.disabled = false;
      btnUseStop.textContent = 'Use this stop';
    }

    btnUseStop.addEventListener('click', applyManualStop);
    manualStopId.addEventListener('keydown', e => { if (e.key === 'Enter') applyManualStop(); });

    btnStart.addEventListener('click', () => {
      watchConfig = {
        route:        document.getElementById('bus-route').value.trim().toUpperCase(),
        stop:         selectedStop,
        alertMinutes: Number(slider.value),
      };
      localStorage.setItem('busAlarmConfig', JSON.stringify(watchConfig));
      enterMonitor();
    });

    btnSettings.addEventListener('click', () => {
      dismissAlarm();
      stopPolling();
      screenMonitor.classList.remove('active');
      screenSetup.classList.add('active');
    });

    /* ════════════════════════════════════════════════════
       MONITOR SCREEN
    ════════════════════════════════════════════════════ */
    function enterMonitor() {
      screenSetup.classList.remove('active');
      screenMonitor.classList.add('active');

      monitorRouteBadge.textContent = watchConfig.route;
      monitorStopName.textContent   = watchConfig.stop.Name;

      setRingState(null);
      otherBusesCard.innerHTML = '<div class="other-empty">Loading…</div>';
      statusLine.textContent   = 'Fetching predictions…';
      lastUpdatedAt = '';
      alarmFired    = false;

      // Warm up AudioContext from within this user-gesture call chain so it
      // won't be blocked when the alarm fires later.
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }

      requestNotificationPermission();
      startPolling();
    }

    function startPolling() {
      stopPolling();
      fetchPredictions();
      tickCountdown = POLL_SECONDS;

      tickTimer = setInterval(() => {
        tickCountdown--;
        if (lastUpdatedAt) {
          statusLine.textContent = `Updated at ${lastUpdatedAt} · next refresh in ${tickCountdown}s`;
        }
        if (tickCountdown <= 0) {
          tickCountdown = POLL_SECONDS;
          fetchPredictions();
        }
      }, 1000);
    }

    function stopPolling() {
      clearInterval(tickTimer);
      tickTimer = null;
    }

    async function fetchPredictions() {
      try {
        const url = `https://api.wmata.com/NextBusService.svc/json/jPredictions?StopID=${encodeURIComponent(watchConfig.stop.StopID)}&api_key=${WMATA_API_KEY}`;
        const res = await fetch(url);
        if (!res.ok) throw new Error(`${res.status}`);
        const data = await res.json();

        renderPredictions(data.Predictions || []);

        const now  = new Date();
        const h    = now.getHours();
        const mm   = String(now.getMinutes()).padStart(2, '0');
        lastUpdatedAt = `${h % 12 || 12}:${mm} ${h >= 12 ? 'PM' : 'AM'}`;
        statusLine.textContent = `Updated at ${lastUpdatedAt} · next refresh in ${tickCountdown}s`;

      } catch (err) {
        console.error('WMATA predictions error:', err);
        statusLine.textContent = `Couldn't refresh — retrying in ${tickCountdown}s`;
      }
    }

    function renderPredictions(predictions) {
      const tracked = predictions
        .filter(p => p.RouteID.toUpperCase() === watchConfig.route)
        .sort((a, b) => a.Minutes - b.Minutes)[0] ?? null;

      const others = predictions
        .filter(p => p !== tracked)
        .sort((a, b) => a.Minutes - b.Minutes);

      setRingState(tracked ? tracked.Minutes : null);
      renderOtherBuses(others);
      maybeFireAlarm(tracked ? tracked.Minutes : null);
    }

    function setRingState(minutes) {
      const threshold = watchConfig.alertMinutes;
      let state;
      if (minutes === null || minutes === undefined) {
        state = 'unknown';
      } else if (minutes <= threshold) {
        state = 'danger';
      } else if (minutes <= threshold + 5) {
        state = 'amber';
      } else {
        state = 'safe';
      }

      countdownWrapper.className  = `countdown-wrapper ${state}`;
      countdownNumber.textContent = minutes != null ? String(minutes) : '--';

      const fill = minutes != null
        ? Math.max(0, Math.min(1, 1 - minutes / RING_MAX_MIN))
        : 0;
      ringFill.style.strokeDashoffset = CIRCUMFERENCE * (1 - fill);
    }

    function renderOtherBuses(others) {
      if (!others.length) {
        otherBusesCard.innerHTML = '<div class="other-empty">No other buses predicted right now</div>';
        return;
      }
      otherBusesCard.innerHTML = others.map(p => `
        <div class="bus-row">
          <div class="bus-route-pill">${p.RouteID}</div>
          <div class="bus-direction">${p.DirectionText || '—'}</div>
          <div class="bus-mins">${p.Minutes}<em> min</em></div>
        </div>
      `).join('');
    }

    /* ════════════════════════════════════════════════════
       ALARM
    ════════════════════════════════════════════════════ */
    function maybeFireAlarm(minutes) {
      const threshold = watchConfig.alertMinutes;

      // Bus has clearly departed when minutes jump well above threshold — arm again
      if (minutes === null || minutes > threshold + 3) {
        alarmFired = false;
      }

      if (minutes !== null && minutes <= threshold && !alarmFired) {
        alarmFired = true;
        triggerAlarm(minutes);
      }
    }

    function triggerAlarm(minutes) {
      alarmRouteBadge.textContent = watchConfig.route;
      alarmMins.textContent       = `${minutes} min away`;
      alarmOverlay.classList.remove('hidden');

      startBeeping();
      sendNotification(watchConfig.route, minutes);
    }

    function dismissAlarm() {
      alarmOverlay.classList.add('hidden');
      stopBeeping();
      // alarmFired stays true so the same approaching bus won't re-trigger
    }

    btnDismiss.addEventListener('click', dismissAlarm);

    /* ── Web Audio beep pattern ───────────────────────── */
    function startBeeping() {
      if (!audioCtx) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      stopBeeping();
      scheduleBeepBurst();
    }

    function scheduleBeepBurst() {
      if (!audioCtx || audioCtx.state === 'closed') return;
      const t = audioCtx.currentTime;
      // Three sharp beeps per burst
      playBeep(t + 0.00, 0.12, 880);
      playBeep(t + 0.20, 0.12, 880);
      playBeep(t + 0.40, 0.12, 1046); // slightly higher pitch on third
      beepTimer = setTimeout(scheduleBeepBurst, 1600);
    }

    function playBeep(startTime, duration, freq) {
      const osc  = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.type            = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.45, startTime);
      gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
      osc.start(startTime);
      osc.stop(startTime + duration + 0.01);
    }

    function stopBeeping() {
      clearTimeout(beepTimer);
      beepTimer = null;
    }

    /* ── Browser notifications ───────────────────────── */
    async function requestNotificationPermission() {
      if ('Notification' in window && Notification.permission === 'default') {
        await Notification.requestPermission();
      }
    }

    function sendNotification(route, minutes) {
      if (!('Notification' in window) || Notification.permission !== 'granted') return;
      new Notification(`🚌 Route ${route} is almost here!`, {
        body: `${minutes} minute${minutes !== 1 ? 's' : ''} away — time to head out!`,
        tag:  'bus-alarm', // replaces any previous notification from this app
      });
    }
  </script>

</body>
</html>
