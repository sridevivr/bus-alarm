<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bus Alarm</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --terracotta: #c1614f;
      --terracotta-dark: #a84e3d;
      --terracotta-light: #f2e0db;
      --terracotta-faint: #fdf6f4;
      --text: #2d2522;
      --text-muted: #7a6460;
      --border: #e0cdc9;
      --white: #ffffff;
      --radius: 12px;
    }

    body {
      font-family: 'Nunito', sans-serif;
      background-color: var(--terracotta-faint);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 48px;
    }

    header {
      text-align: center;
      margin-bottom: 32px;
    }

    .bus-icon {
      font-size: 48px;
      line-height: 1;
      margin-bottom: 8px;
    }

    header h1 {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--terracotta);
      letter-spacing: -0.3px;
    }

    header p {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .card {
      background: var(--white);
      border-radius: 20px;
      padding: 28px 24px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 4px 24px rgba(193, 97, 79, 0.10);
    }

    .field {
      margin-bottom: 24px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 8px;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px 16px;
      font-family: 'Nunito', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      color: var(--text);
      background: var(--terracotta-faint);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--terracotta);
      box-shadow: 0 0 0 3px rgba(193, 97, 79, 0.15);
    }

    input[type="text"]::placeholder {
      color: #c4adaa;
      font-weight: 400;
    }

    .stop-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .stop-row input[type="text"] {
      flex: 1;
    }

    .btn-find {
      flex-shrink: 0;
      padding: 12px 18px;
      font-family: 'Nunito', sans-serif;
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--terracotta);
      background: var(--terracotta-light);
      border: 2px solid var(--terracotta-light);
      border-radius: var(--radius);
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
      white-space: nowrap;
    }

    .btn-find:hover {
      background: #e8c8c2;
      border-color: #e8c8c2;
    }

    .btn-find:active {
      background: #d9b0a9;
    }

    /* Slider */
    .slider-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 8px;
    }

    .slider-value {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--terracotta);
    }

    .slider-value span {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      background: var(--terracotta-light);
      border-radius: 99px;
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 24px;
      height: 24px;
      background: var(--terracotta);
      border-radius: 50%;
      border: 3px solid var(--white);
      box-shadow: 0 2px 6px rgba(193, 97, 79, 0.4);
      transition: transform 0.15s;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.15);
    }

    input[type="range"]::-moz-range-thumb {
      width: 24px;
      height: 24px;
      background: var(--terracotta);
      border-radius: 50%;
      border: 3px solid var(--white);
      box-shadow: 0 2px 6px rgba(193, 97, 79, 0.4);
      cursor: pointer;
    }

    .slider-ticks {
      display: flex;
      justify-content: space-between;
      margin-top: 6px;
      padding: 0 2px;
      font-size: 0.75rem;
      color: #c4adaa;
      font-weight: 600;
    }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 28px 0;
    }

    .btn-start {
      width: 100%;
      padding: 16px;
      font-family: 'Nunito', sans-serif;
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--white);
      background: var(--terracotta);
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      letter-spacing: 0.2px;
      transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
      box-shadow: 0 4px 14px rgba(193, 97, 79, 0.35);
    }

    .btn-start:hover {
      background: var(--terracotta-dark);
      box-shadow: 0 6px 18px rgba(193, 97, 79, 0.45);
    }

    .btn-start:active {
      transform: scale(0.98);
    }

    footer {
      margin-top: 24px;
      font-size: 0.8rem;
      color: #c4adaa;
      text-align: center;
    }
  </style>
</head>
<body>

  <header>
    <div class="bus-icon">🚌</div>
    <h1>Bus Alarm</h1>
    <p>Never miss your stop again</p>
  </header>

  <div class="card">

    <div class="field">
      <label for="bus-route">Bus Route</label>
      <input type="text" id="bus-route" placeholder="e.g. D50" autocomplete="off" />
    </div>

    <div class="field">
      <label for="stop-name">Stop Name</label>
      <div class="stop-row">
        <input type="text" id="stop-name" placeholder="e.g. Central Station" autocomplete="off" />
        <button class="btn-find" id="btn-find">Find</button>
      </div>
    </div>

    <div class="field">
      <div class="slider-header">
        <label for="alert-minutes" style="margin-bottom:0">Alert me</label>
        <div class="slider-value"><span id="minutes-display">10</span> <span>min before</span></div>
      </div>
      <input type="range" id="alert-minutes" min="2" max="20" value="10" />
      <div class="slider-ticks">
        <span>2</span>
        <span>5</span>
        <span>10</span>
        <span>15</span>
        <span>20</span>
      </div>
    </div>

    <div class="divider"></div>

    <button class="btn-start" id="btn-start">Start Watching 🔔</button>

  </div>

  <footer>Stay on track, wherever you ride.</footer>

  <script>
    const slider = document.getElementById('alert-minutes');
    const display = document.getElementById('minutes-display');

    slider.addEventListener('input', () => {
      display.textContent = slider.value;
    });

    document.getElementById('btn-find').addEventListener('click', () => {
      const stop = document.getElementById('stop-name').value.trim();
      console.log('Find stop:', stop || '(no input)');
    });

    document.getElementById('btn-start').addEventListener('click', () => {
      const route = document.getElementById('bus-route').value.trim();
      const stop = document.getElementById('stop-name').value.trim();
      const minutes = slider.value;
      console.log('Start Watching', { route, stop, alertMinutes: Number(minutes) });
    });
  </script>

</body>
</html>
